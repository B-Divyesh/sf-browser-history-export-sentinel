[package]
name = "history-export-sentinel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Copy-first, verifiable Firefox and Chromium history exports"
readme = "README.md"
keywords = ["browser", "history", "export", "firefox", "chromium"]
categories = ["command-line-utilities"]

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
